name: Atualizar dados de mercado

on:
  schedule:
    # Dias úteis: 13h e 18h40 (horário de Brasília = UTC-3). O GitHub pode atrasar alguns minutos.
    - cron: "0 16 * * 1-5"
    - cron: "40 21 * * 1-5"
  workflow_dispatch:
  push:
    paths:
      - tickers.json
      - coletor/**

permissions:
  contents: write

concurrency:
  group: mercado
  cancel-in-progress: false

jobs:
  coletar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install requests

      - run: python coletor/coletar_mercado.py

      - name: Publicar se mudou
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add mercado.json historico_mercado.json
          if git diff --cached --quiet; then
            echo "Nada mudou."
          else
            git commit -m "Dados de mercado $(TZ=America/Sao_Paulo date '+%d/%m/%Y %H:%M')"
            git push
          fi
